<!--
========================================================================================
Smart University Complaint System (SUCS v1.0) - Login Portal View
========================================================================================
File: templates/login.html
Purpose:
  - Renders the unified entrypoint for all system roles (Student, Admin, HOD).
  - Handles client-side empty-field validation before form submission.
  - Displays server-side flash notification messages (e.g. invalid credentials, logouts).
  - Provides one-click demo credentials filling for viva testing.
========================================================================================
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SUCS Prototype — Login</title>
  <!-- Load Tailwind CSS via CDN for rapid responsive layout and styling -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4">

  <!-- Main Card Container: Centered white card with elevated drop shadow -->
  <div class="w-full max-w-md bg-white rounded-2xl p-8 shadow-2xl">
    
    <!-- Portal Header & Security Lock Icon -->
    <div class="text-center mb-6">
      <div class="inline-flex p-3 bg-blue-600 text-white rounded-xl mb-2">
        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
        </svg>
      </div>
      <h1 class="text-2xl font-bold text-slate-900">Smart University Complaint System</h1>
      <p class="text-xs text-slate-500 mt-1">Prototype Phase • Login Portal</p>
    </div>

    <!-- Server-Side Flash Alerts (Renders messages emitted via Flask's flash() function) -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="mb-4 p-3 rounded-lg text-xs font-semibold {% if category == 'danger' %}bg-red-50 text-red-700 border border-red-200{% else %}bg-blue-50 text-blue-700 border border-blue-200{% endif %}">
            {{ message }}
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <!-- Login Form: Submits credentials via HTTP POST to /login endpoint -->
    <form action="/login" method="POST" onsubmit="return validateLogin(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-bold uppercase text-slate-700 mb-1">Username *</label>
        <input type="text" id="username" name="username" required placeholder="e.g. student1, admin1, hod1" class="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"/>
      </div>

      <div>
        <label class="block text-xs font-bold uppercase text-slate-700 mb-1">Password *</label>
        <input type="password" id="password" name="password" required placeholder="••••••••" class="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"/>
      </div>

      <!-- Client-Side Dynamic Error Alert (Shown when input fields are empty) -->
      <div id="clientError" class="hidden p-2.5 bg-red-50 text-red-600 text-xs rounded-lg border border-red-200"></div>

      <!-- Submit Button -->
      <button type="submit" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold text-sm rounded-xl shadow-lg transition cursor-pointer">
        Sign In to Portal
      </button>
    </form>

    <!-- Quick Demo Credential Helper Buttons (Convenient for quick evaluator demonstrations) -->
    <div class="mt-6 pt-4 border-t border-slate-100 text-center">
      <p class="text-xs text-slate-400 font-semibold mb-2">Prototype Quick Demo Accounts (password: password123):</p>
      <div class="flex justify-center gap-2 text-xs">
        <button type="button" onclick="fillDemo('student1')" class="px-2.5 py-1 bg-blue-50 text-blue-700 rounded font-mono hover:bg-blue-100 border border-blue-200 cursor-pointer">Student 1</button>
        <button type="button" onclick="fillDemo('admin1')" class="px-2.5 py-1 bg-emerald-50 text-emerald-700 rounded font-mono hover:bg-emerald-100 border border-emerald-200 cursor-pointer">Admin 1</button>
        <button type="button" onclick="fillDemo('hod1')" class="px-2.5 py-1 bg-purple-50 text-purple-700 rounded font-mono hover:bg-purple-100 border border-purple-200 cursor-pointer">HOD 1</button>
      </div>
    </div>
  </div>

  <!-- Client-Side JavaScript Logic -->
  <script>
    /**
     * Fills the login form automatically with the selected demo account credentials.
     * @param {string} username - The selected role username (student1, admin1, hod1).
     */
    function fillDemo(username) {
      document.getElementById('username').value = username;
      document.getElementById('password').value = 'password123';
    }

    /**
     * Validates input fields prior to submitting the form to the backend server.
     * Prevents empty submissions and displays an inline error message.
     * @param {Event} e - The form submission event.
     */
    function validateLogin(e) {
      const u = document.getElementById('username').value.trim();
      const p = document.getElementById('password').value.trim();
      const err = document.getElementById('clientError');

      if (!u || !p) {
        err.innerText = 'Username and Password cannot be empty.';
        err.classList.remove('hidden');
        e.preventDefault(); // Stop submission
        return false;
      }
      err.classList.add('hidden');
      return true;
    }
  </script>
</body>
</html>
